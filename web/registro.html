<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/login-style.css">
    <script src="js/registro.js" defer></script>
    <title>Registro Administrador - UNER</title>
</head>
<body>
    <header> 
        <img src="imagen/logo_fcad.png" alt="Facultad de Ciencias de la Administración">
    </header>

    <main>
        <div class="contenedor"> 
            <h1>Registrarse</h1>
            <form id="form-registro"> 
                <label for="reg-usuario">Nombre:</label>
                <input type="text" id="reg-usuario" placeholder="Ej: Sofía" required>
            
                <label for="reg-apellido">Apellido:</label>
                <input type="text" id="reg-apellido" placeholder="Ej: Carrazzoni" required>
                
                <label for="reg-usuario">Nombre de usuario:</label>
                <input type="text" id="reg-usuario" placeholder="Ej: sc123" required>
                
                <label for="reg-contraseña">Contraseña:</label>
                <input type="password" id="reg-contraseña" placeholder="Mínimo 6 caracteres" required>
                
                <button type="submit" id="btn-registrar">Registrar</button>
                
                <p class="link-alternativo">¿Ya tienes cuenta? <a href="login.html">Inicia Sesión</a></p>
            </form>
        </div>
    </main>
</body>
</html>
