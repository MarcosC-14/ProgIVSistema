<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="js/login.js" defer></script>
    <link rel="stylesheet" href="css/login-style.css">
    <title>Inicio Sesion - UNER</title>
     
   
</head>
<body>
   <header> 
        <img src="imagen/logo_fcad.png" alt="Facultad de Ciencias de la Administración">
    </header>

    <main>
        <div class="contenedor"> 
            <h1> Iniciar Sesión</h1>
            <form action="" id="form-login"> 
                <label for="usuario">
                    Nombre de usuario:
                </label>
                <input type="text" name="usuario" id="usuario"  placeholder="usuario..." required>
                <label for="contraseña">
                    Contraseña:
                </label>
                <input type="password" name="contraseña" id="contraseña" required>
                <button type="submit" id="btn-ingresar">Ingresar</button>
                <p class="link-alternativo">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
            </form>
        </div>
    </main>
</body>
</html>
