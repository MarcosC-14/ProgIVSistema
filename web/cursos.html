<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio - Cursos FCAD - UNER</title>
    <link rel="stylesheet" href="css/estilo.css">
    <link rel="stylesheet" href="css/bootstrap-reboot.min.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <script src="js/cursos.js" type= "module" defer></script>
    <script src="js/bootstrap.bundle.min.js" defer></script>
</head>
<body>
    <header>
        <div class = "contenedor">
            <img src="imagen/logo_fcad.png" alt="Logo FCAD">    
            <h1>Cursos FCAD - UNER</h1>
        </div> 
        
    </header>

    <div class="contenedor-principal">
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="">Inscripciones</a></li>
                <li><a href="">Estudiantes</a></li>
                <li><a href="cursos.html" class="active">Cursos</a></li>
        </ul> 
        </nav>
    </div>

    <main>
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Listado de Cursos</h2>
                <button type="button" class="btn btn-botonNormal" id="btnAgregarCurso" data-bs-toggle="modal" data-bs-target="#modalCurso">
                    + Agregar Curso          
                </button>
        </div> 

        <div id="error" class="alert alert-danger" style="display: none" role="alert"></div>
        
        <table class = "table table-hover">
            <thead>
                <tr>
                    <th>ID Curso</th>
                    <th>Nombre</th>
                    <th>Descripción</th>
                    <th>Fecha de inicio</th>
                    <th>Cantidad de horas</th>
                    <th>Inscriptos máximos</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="tbody">

            </tbody>
       </table>
       
       <nav aria-label="Navegación de registros" class="mt-4">
            <ul class="pagination justify-content-center" id="paginacion-contenedor">
                </ul>
        </nav>
       
    </main>

    <footer>
        <p>&copy; 2026 Cursos FCAD - UNER. Todos los derechos reservados.</p>
    </footer>

    
    <!-- Contenedor que lo fija en la esquina superior derecha -->
    <div class="toast-container position-fixed top-0 start-50 translate-middle-x p-3">
    
    <!-- El Toast (le agregamos un ID para controlarlo con JS) -->
        <div id="miToast" class="toast text-bg-success" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <strong class="me-auto">Notificación</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div id="contenidoToast" class="toast-body"></div>
        </div>

    </div>


    <div class="modal fade" id="modalCurso" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content bg-white shadow">
            
            <div class="modal-header">
                <h5 class="modal-title" id="modalCursoLabel">Detalles del Curso</h5>
                <button type="button" class="btn btn-botonCerrar" data-bs-dismiss="modal" aria-label="Close">X</button>               
            </div>

                <div class="modal-body">
                    <form id="formCurso">
                        <input type="hidden" id="modalIdCurso">

                        <div class = "mb-3">
                            <label class="form-label">Nombre del Curso</label>
                            <input type="text" class="form-control" id="modalNombre" placeholder="Ej: Robotica" autocomplete="off" required>
                        </div>

                        <div class= "mb-3">
                            <label class="form-label">Descripción:</label>
                            <textarea class="form-control" id="modalDescripcion" placeholder="Ej: Se utilizara Arduino" autocomplete="off" required></textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Fecha de Inicio:</label>
                            <input type="date" class="form-control" id="modalFecha" autocomplete="off" required>
                        </div>    
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label">Cantidad de Horas:</label>
                                <input type="number" class="form-control" min="1" id="modalHoras" placeholder="Ej: 3" autocomplete="off" required>
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label">Cupo Máximo:</label>
                                <input type="number" class="form-control" min="1" id="modalCupo" placeholder="Ej: 43" autocomplete="off" required>
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label">Estado del curso:</label>
                                <select class="form-select" id="modalEstadoCurso" required>
                                    <option selected disabled value="">Selecciona un estado ...</option>
                                </select>
                            </div>
                        </div>

                        
                        <div class="modal-footer">
                            <button type="button" class="btn btn-botonNormal" id="btnEliminar">Eliminar Curso</button>
                            <button type="submit" class="btn btn-botonNormal" id="btnGuardar">Modificar Curso</button>
                        </div>
                    </form>
                </div>   
            </div>
        </div>
    </div>    
</body>
</html>
